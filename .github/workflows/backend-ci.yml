name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Build & Test Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Daycare/Daycare.slnx

      - name: Build solution (Release)
        run: dotnet build Daycare/Daycare.slnx --no-restore --configuration Release

      - name: Run unit & integration tests
        run: dotnet test Daycare/Daycare.slnx --no-build --configuration Release --verbosity normal
